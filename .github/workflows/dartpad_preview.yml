name: package:dartpad_preview

permissions:
  contents: read

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/dartpad_preview.yml'
      - 'pkgs/dartpad_preview/**'
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/dartpad_preview.yml'
      - 'pkgs/dartpad_preview/**'
  schedule:
    - cron: '0 0 * * 0'

jobs:
  codemirror:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - uses: dart-lang/setup-dart@65eb853c7ba17dde3be364c3d2858773e7144260

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '20'

      - name: Install Dart workspace dependencies
        working-directory: pkgs/dartpad_preview
        run: dart pub get

      - name: Test and build codemirror-lang-dart
        working-directory: pkgs/dartpad_preview/codemirror-lang-dart
        run: |
          npm ci
          npm test
          npm run build

      - name: Install codemirror-dart Node dependencies
        working-directory: pkgs/dartpad_preview/codemirror-dart
        run: npm ci

      - name: Check codemirror-dart Dart sources
        working-directory: pkgs/dartpad_preview/codemirror-dart
        run: |
          dart format --output=none --set-exit-if-changed lib test
          dart analyze --fatal-infos
          dart test --platform chrome

      - name: Check codemirror-dart TypeScript and tests
        working-directory: pkgs/dartpad_preview/codemirror-dart
        run: |
          npm run format:check
          npm run typecheck
          npm test

      - name: Verify codemirror-dart generated assets
        working-directory: pkgs/dartpad_preview/codemirror-dart
        run: |
          npm run build
          git diff --exit-code -- lib/assets

  editor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - uses: dart-lang/setup-dart@65eb853c7ba17dde3be364c3d2858773e7144260

      - name: Install dependencies
        working-directory: pkgs/dartpad_preview
        run: dart pub get

      - name: Check Dart sources
        working-directory: pkgs/dartpad_preview/dartpad_editor
        run: |
          dart format --output=none --set-exit-if-changed lib test
          dart analyze --fatal-infos

      - name: Run tests
        working-directory: pkgs/dartpad_preview/dartpad_editor
        run: dart test

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - uses: dart-lang/setup-dart@65eb853c7ba17dde3be364c3d2858773e7144260

      - name: Install dependencies
        working-directory: pkgs/dartpad_preview
        run: dart pub get

      - name: Check Dart sources
        working-directory: pkgs/dartpad_preview/dartpad_frontend
        run: |
          dart format --output=none --set-exit-if-changed lib test
          dart analyze --fatal-infos

      - name: Run tests
        working-directory: pkgs/dartpad_preview/dartpad_frontend
        run: dart test

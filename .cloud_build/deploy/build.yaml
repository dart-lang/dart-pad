# Invoked by .cloud_build/deploy/trigger-{pr,main}.yaml.
#
# Runs as builder@dart-pad.iam.gserviceaccount.com, which has:
#  * no Firebase permissions,
#  * no Cloud Build permissions,
#  * Can write (not overwrite) to GCS bucket holding ${_OUTPUT_TAR}
#
# This uploads a tarball to ${_OUTPUT_TAR} with:
#  * public/
#  * firebase.json

logsBucket: gs://dart-pad-build-output
options:
  logStreamingOption: STREAM_OFF
  machineType: E2_HIGHCPU_8

steps:
  - name: dart:stable
    script: |
      #!/usr/bin/env bash
      set -eu

      cd pkgs/dartpad_preview/dartpad_frontend
      dart pub get
      (cd ../examples && dart run build_examples.dart)
      dart run tool/setup_sdk_assets.dart
      dart run jaspr_cli:jaspr build --experimental-wasm -v

      for sdk in dart flutter; do
        for entrypoint in worker.js sandbox.js; do
          asset="build/jaspr/dartpad/${sdk}/${entrypoint}"
          if [[ ! -f "${asset}" || ! -s "${asset}" ]]; then
            echo "Missing or empty SDK entrypoint: ${asset}" >&2
            exit 1
          fi
        done
      done

      mv build/jaspr public
      tar -cf /workspace/site.tar firebase.json public

  - name: gcr.io/google.com/cloudsdktool/cloud-sdk:slim
    env:
      - CLOUDSDK_STORAGE_PARALLEL_COMPOSITE_UPLOAD_ENABLED=False
    args:
      - gcloud
      - storage
      - cp
      - /workspace/site.tar
      - ${_OUTPUT_TAR}

<!DOCTYPE html>
<html>
    <head>
        <meta charset="utf-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <meta name="color-scheme" content="light dark">
        <meta name="scaffolded-by" content="https://github.com/schultek/jaspr">

        <title>DartPad</title>
        <link rel="icon" type="image/png" href="favicon.png">

        <!-- Loads the generated CSS file. -->
        <!-- This contains all @css declarations from your components. -->
        <link rel="stylesheet" href="main.css">

        <!-- Fonts & Icons -->
        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
        <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;600&family=Roboto+Mono&display=swap" rel="stylesheet">
        <link rel="stylesheet"
            href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" />

        <!-- Theme initialization - runs before dart code loads -->
        <script>
            let userTheme = window.localStorage.getItem('dartpad:theme');
            if (userTheme != null) {
                document.documentElement.setAttribute('data-theme', userTheme);
            } else if (window.matchMedia('(prefers-color-scheme: dark)').matches) {
                document.documentElement.setAttribute('data-theme', 'dark');
            } else {
                document.documentElement.setAttribute('data-theme', 'light');
            }
        </script>

        <!-- CodeMirror must be installed on globalThis before Dart interop loads. -->
        <script src="packages/codemirror_dart/assets/codemirror-dart.bundle.js"></script>

        <!-- Loads and runs the compiled 'main.client.dart' file. -->
        <!-- Can be changed to any other '.client.dart' file inside /lib. -->
        <script defer src="main.client.dart.js"></script>
    </head>
    <body>
        <!-- Your app component will be inserted here. -->
    </body>
</html>

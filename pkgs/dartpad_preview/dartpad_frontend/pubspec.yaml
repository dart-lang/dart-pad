name: dartpad_frontend
description: Frontend of the client-side DartPad
version: 0.0.1
publish_to: none

environment:
  sdk: ^3.12.0

resolution: workspace

dependencies:
  archive: ^4.0.9
  clock: ^1.1.2
  codemirror_dart: any
  dartpad: 0.0.5
  dartpad_editor: any
  http: ^1.6.0
  jaspr: ^0.23.2
  jaspr_content: ^0.5.3
  jaspr_router: ^0.8.2
  logging: ^1.3.0
  meta: ^1.16.0
  path: ^1.9.1
  web: ^1.1.1
  yaml_edit: ^2.2.4

dev_dependencies:
  build_runner: ^2.10.0
  build_web_compilers: ^4.8.0
  crypto: ^3.0.6
  jaspr_builder: ^0.23.2
  jaspr_cli: ^0.23.2
  jaspr_test: ^0.23.2
  lints: ^6.0.0
  test: ^1.25.8

jaspr:
  mode: client
  flutter: plugins
  styles: standalone

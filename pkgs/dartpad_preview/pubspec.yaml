# Workspace for DartPad preview packages.
# This is intentionally separate from the top-level dartpad workspace
# to avoid being constrained by its potentially outdated dependencies.
name: dartpad_preview_workspace
publish_to: none

workspace:
  - codemirror-lang-dart
  - codemirror-dart
  - dartpad_editor
  - dartpad_frontend

environment:
  sdk: ^3.12.0-0

dev_dependencies:
  dart_flutter_team_lints: ^3.5.2

dependency_overrides:
  dartpad:
    git:
      url: https://github.com/dart-lang/sdk
      path: pkg/dartpad
      ref: 941e2ec4ff23b3c8f4292ddf802a91c026937195
  # TODO: Remove once https://github.com/dart-lang/webdev/issues/2854 is resolved.
  frontend_server_client:
    git:
      url: https://github.com/schultek/webdev.git
      path: frontend_server_client
      ref: frontend-server-client-libraries
  # TODO: Remove once Jaspr v0.24.0 is released.
  jaspr:
    git:
      url: https://github.com/schultek/jaspr
      path: packages/jaspr
      ref: 296b4001a28d23981cdc5242d1815f9e7b3f4a86
  jaspr_builder:
    git:
      url: https://github.com/schultek/jaspr
      path: packages/jaspr_builder
      ref: 296b4001a28d23981cdc5242d1815f9e7b3f4a86
  jaspr_cli:
    git:
      url: https://github.com/schultek/jaspr
      path: packages/jaspr_cli
      ref: 296b4001a28d23981cdc5242d1815f9e7b3f4a86

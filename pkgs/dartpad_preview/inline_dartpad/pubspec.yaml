name: inline_dartpad
description: >-
  Upgrades <pre data-dartpad-*> code blocks on a documentation page into
  lightweight DartPad editors sharing one worker, one language server and one
  hidden sandbox per page.
version: 0.0.1
publish_to: none

environment:
  sdk: ^3.12.0-0

resolution: workspace

dependencies:
  codemirror_dart: any
  dartpad: ^0.1.1
  web: ^1.1.1

dev_dependencies:
  path: ^1.9.1
  test: ^1.31.0

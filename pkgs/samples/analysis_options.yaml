include: package:flutter_lints/flutter.yaml

analyzer:
  errors:
    avoid_print: ignore
  exclude:
    - build/**
    - android/**
    - ios/**
    - web/**
    - windows/**
    - macos/**
    - linux/**

linter:
  rules:
    - directives_ordering
    - prefer_relative_imports
    - prefer_single_quotes
